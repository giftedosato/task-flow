services:
  - type: web
    name: taskflow-react
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: /api
      - key: TASKFLOW_API_ORIGIN
        value: https://task-flow-six-rouge.vercel.app
